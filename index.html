<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GraphQL Profile Dashboard</title>
        <link rel="stylesheet" href="./styles.css">
    </head>
    <body>
        <header id="app-header" class="app-header">
            <h1>Dashboard</h1>
        </header>

        <main class="app-main">
            <section id="login-view" class="view">
                <h2>Login</h2>
                <p id="login-message" class="message" aria-live="polite"></p>
                <form id="login-form" class="card">
                    <label for="identifier">Username or Email</label>
                    <input id="identifier" name="identifier" type="text" required>

                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" required>

                    <button type="submit">Sign in</button>
                </form>
            </section>

            <section id="profile-view" class="view hidden">
                <div class="profile-top">
                    <h2 id="profile-heading">Profile</h2>
                    <button id="logout-button" type="button">Logout</button>
                </div>

                <p id="profile-message" class="message" aria-live="polite"></p>

                <div class="grid">
                    <article class="card">
                        <h3>Identity</h3>
                        <div id="identity-content">Loading...</div>
                    </article>

                   <article class="card">
                        <h3>Performance</h3>
                        <div id="performance-content">Loading...</div>
                    </article>
         
                    <article class="card">
                        <h3>Progress</h3>
                        <div id="progress-content">Loading...</div>
                    </article>

                   <article class="card stats">
                        <h3>Statistics</h3>
                        <div class="stats-top-row">
                            <div class="graph-block">
                                <h4 class="graph-title">XP Progress Over Time</h4>
                                <div id="chart-a" class="chart-placeholder">Graph A placeholder</div>
                            </div>
                            <div class="graph-block">
                                <h4 class="graph-title">XP Source Breakdown</h4>
                                <div id="chart-c" class="chart-placeholder">Graph C placeholder</div>
                            </div>
                        </div>
                        <div class="graph-block">
                            <h4 class="graph-title">Top Group Collaborators</h4>
                            <div id="chart-d" class="chart-placeholder">Graph D placeholder</div>
                        </div>
                   </article>
                </div>
            </section>
        </main>

        <script type="module" src="./js/main.js"></script>
    </body>
</html>
